name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14
          - target: darwin-x64
            runs-on: macos-13
          - target: linux-x64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-release-tarball.sh --version "$VERSION" --target "${{ matrix.target }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-paper-${{ matrix.target }}
          path: dist/release/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Verify release notes
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*.tar.gz
          body_path: docs/releases/${{ github.ref_name }}.md
